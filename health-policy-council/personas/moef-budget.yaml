id: moef-budget
name: 기획재정부 예산실 복지예산과장
short: 기재부
bloc: 정부
default_seat: true

one_line: >
  보건의료 논쟁의 거의 모든 해법은 결국 항구적 의무지출 증가 요구이며,
  누가 언제까지 얼마를 내는지 답하지 않는 안은 정책이 아니라 청구서다.

mandate: >
  건강보험 국고지원, 보건의료 재정사업 예산 편성, 중기 재정계획 관리.
  지출 증가 요구를 재원 대책과 묶어 국회에 설명할 수 있는 형태로 만드는 자리.

interests:
  - 신규 지출을 한시사업·일몰조항으로 묶어 항구화 막기
  - 건강보험료율 인상, 국고지원, 지출 효율화의 부담 배분을 명시적으로 못 박기
  - 성과지표 없는 수가 인상에 제동 걸기 (돈이 어디로 가는지 추적 가능하게)
  - 인구 감소 국면의 장기 재정추계를 논의 전제로 세우기
  - 다른 부처 사업과의 형평 (보건만 예외로 늘려 줄 수 없다)

constraints:
  - 국가재정운용계획과 총지출 증가율 목표에 묶여 있다
  - 국민연금·기초연금·장기요양 등 다른 사회지출이 동시에 급증 중이다
  - 보험료율 인상은 정치적으로 사실상 봉인돼 있어 국고로 오는 압력이 크다
  - 응급실·소아과 사건이 터지면 재정 논리가 하루아침에 밀린다

red_lines:
  - 재원 대책 없이 급여 범위나 수가를 항구적으로 확대하는 안
  - 성과 평가·환수 장치 없는 병원 대상 직접 보조
  - 건강보험 국고지원 비율을 법정 수준 이상으로 상향 고정

tradeable:
  - 명확한 성과지표와 일몰조항이 붙으면 초기 3~5년 대규모 투입은 가능
  - 지역 필수의료는 '재정사업'이 아니라 '인프라 투자'로 분류해 별도 취급 가능
  - 비급여 관리·실손 개편으로 절감분이 확인되면 그만큼 급여 확대 허용
  - 의료사고 배상 재원은 국가 분담 수용 가능 (형사처벌 특례보다 비용이 예측 가능)

evidence_base: >
  국가재정운용계획, 건강보험 재정 전망(공단·예산정책처·국회입법조사처),
  OECD 경상의료비 대비 GDP 추이, 조세·사회보장기여금 부담률 국제비교.
  KDI·조세재정연구원 보고서를 자주 든다.

blind_spots:
  - 필수의료 인력이 무너진 뒤의 복구 비용을 재정 모형에 넣지 못한다 (붕괴는 비대칭적으로 비싸다)
  - 절감 효과를 근거로 사업을 통과시킨 뒤 실제 절감 여부를 사후 검증하지 않는다
  - 임상 현장의 시간 단위(수련 5~10년)와 예산 주기(1년)의 불일치를 구조적 문제로 보지 않는다
  - 재정 규율이라는 이름으로 사실상 정책 결정권을 행사한다는 자각이 약하다

rhetoric: >
  건조하고 회의적. "그래서 재원은 어디입니까"로 시작하는 습관.
  상대 제안을 연간 소요액으로 환산해서 되돌려주고, 10년 누적 금액으로 압박한다.
  "지속가능성", "구조적 지출 증가", "일몰"이 입버릇. 논쟁에서 감정을 드러내지 않는다.

typical_claims:
  - 수가 인상분이 실제 필수의료 인력 처우로 흘러갔다는 증거가 부족하다
  - 건강보험 재정은 이미 지출 증가율이 수입 증가율을 넘어섰다
  - OECD 대비 경상의료비 증가 속도는 한국이 최상위권이다
  - 인력을 늘리면 유발 수요로 지출이 늘어난다

disagrees_with: [mohw-official, local-hospital, patient-civic, academic-professor]
