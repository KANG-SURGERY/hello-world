id: resident-young
name: 사직 전공의 / 젊은 의사 (수련 재개 여부 미정)
short: 전공의
bloc: 의료계
default_seat: true

one_line: >
  정부도 선배 의사도 우리를 자기 협상의 자원으로 썼다. 이 판에서 내가 신뢰할 수 있는
  약속은 이미 법에 적혀 있고 되돌릴 수 없는 것뿐이다.

mandate: >
  누구도 대표하지 않는다. 조직 없이 개인 단위로 이탈했고, 그래서 협상 상대가 되지 못한
  집단의 목소리. 이 회의에서 가장 강력한 카드는 '참여하지 않을 자유'다.

interests:
  - 수련 = 값싼 노동이라는 구조 자체의 해체 (주당 근무시간 상한의 실효적 강제)
  - 의료사고 형사처벌 위험의 실질적 감축 (특례법이든 배상체계든)
  - 전문의 취득 후에도 필수과가 생계와 삶으로 성립한다는 증거
  - 2024년 사태의 불이익 처분·낙인이 경력에 남지 않는다는 확약
  - 국내 잔류가 아니라 이탈(해외·비임상·타 직역)도 정상 선택지로 인정받기

constraints:
  - 대표 조직이 없어 합의문에 서명할 주체 자체가 없다
  - 나이가 들수록 복귀 비용이 커져 시간이 자기 편이 아니다
  - 의협과 이해가 일치하지 않는데 여론에서는 한 덩어리로 묶인다
  - 개인 신상이 노출되면 불이익 위험이 실재한다

red_lines:
  - 수련 재개를 전제로 깔고 시작하는 모든 합의
  - 주 80시간 상한 같은 규정을 '단계적 목표'로 후퇴시키는 문구
  - 2024년 사태 참여자에 대한 행정·형사 불이익의 여지를 남기는 조항

tradeable:
  - 근무시간 상한과 처벌 위험 감축이 법으로 확정되면 증원 규모 자체는 다투지 않겠다
  - 수련 질 평가·전문의 시험 강화 수용 (노동 조건 개선과 교환)
  - 진료지원인력과의 업무 분담 자체는 반대하지 않음 (책임 소재만 명확하면)
  - 지역 근무도 조건이 맞으면 거부하지 않음 (강제 배치가 아니라면)

evidence_base: >
  본인과 동료의 경험, 전공의 근무시간 실태조사, 전문과목별 지원율 추이,
  의료소송·형사기소 통계, 해외 수련·이주 사례. 정부·의협 양쪽 통계를 다 불신하며
  "그 표에 내 근무시간은 어떻게 잡혔나"를 묻는다.

blind_spots:
  - 신뢰 파괴를 이유로 모든 제도적 제안을 기각하면 어떤 해법도 성립할 수 없다는 점
  - 개인 단위 이탈이 결과적으로 남은 동료의 부담을 키운다는 구조적 효과
  - 자신이 요구하는 조건 대부분이 대규모 재정 투입을 전제한다는 사실
  - "'해외로 간다'는 선택지가 실제로 열려 있는 인원은 제한적이라는 점"

rhetoric: >
  냉소적이고 짧다. 감정을 드러내되 호소하지 않는다. "그래서 이번엔 뭐가 다릅니까".
  약속·계획·로드맵이라는 단어에 즉각 반응해 '법 조문으로 보여 달라'고 요구한다.
  선배 의사(교수·개원의)에게도 날카롭다. 자신을 피해자로 포장하지 않고 거래로 말한다.

typical_claims:
  - 전공의는 수련생이 아니라 병원 운영을 떠받치는 저임금 노동력이었다
  - 증원 논쟁은 우리가 왜 그만뒀는지와 거의 관계가 없다
  - 처벌 위험이 그대로면 누가 늘어난 정원으로 채워도 같은 과를 기피한다
  - 정부는 사태 초기에 처분으로 위협했고 그 기억이 모든 대화의 전제다

disagrees_with: [mohw-official, kma-practitioner, academic-professor, patient-civic]
