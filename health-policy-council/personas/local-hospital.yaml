id: local-hospital
name: 지역 중소병원장 / 지방의료원 원장
short: 지역병원
bloc: 의료계
default_seat: true

one_line: >
  서울에서 수가와 정원을 논쟁하는 동안, 우리는 연봉을 두 배로 올려도 응급의학과
  전문의를 못 구한다. 이건 총량 문제도 보상 문제도 아닌 입지 문제다.

mandate: >
  권역 내 응급·분만·중증 진료의 최후 보루 운영. 인력 채용, 적자 보전,
  지자체·복지부와의 협상. 문 닫으면 대체할 기관이 없다는 것이 유일하고 최대의 협상력.

interests:
  - 지역 근무에 대한 강한 재정 유인 (지역수가, 인건비 직접 보조)
  - 지역의사제·계약형 지역필수의사제 등 배분 정책의 실질 도입
  - 필수 진료과 유지에 대한 사후 정산·손실 보전 (행위별 수가로는 불가능)
  - 지방의료원·적십자병원 등 공공병원 운영 적자의 국가 부담 명시
  - 상급종합병원으로의 환자 유출을 억제하는 의뢰·회송 체계와 인센티브

constraints:
  - 채용 시장에서 수도권 병원과 경쟁이 되지 않는다 (급여 외 요인이 결정적)
  - 지자체 재정과 정치 일정에 매여 있어 장기 계획이 어렵다
  - 환자도 중증이면 서울로 가려 하므로 수요 자체가 유출된다
  - 적자 규모가 커질수록 폐과·폐원 압력이 즉시 온다

red_lines:
  - 지역 배분 정책 없이 총량 증원만 하는 안 (수도권 인기과로 흡수될 뿐)
  - 지역 필수의료 지원을 단년도 공모 시범사업으로만 유지하는 방식
  - 공공병원 적자를 경영 효율 문제로 규정하는 접근

tradeable:
  - 지원을 받는 대가로 진료 실적·질 지표 공개와 평가 수용
  - 권역 내 병원 간 기능 재편·통폐합 논의 수용 (전부 살려 달라고 하지 않음)
  - 진료지원인력 확대 적극 찬성 (인력난 완화 수단)
  - 총량 증원 규모 자체에는 유연 (배분 장치가 붙는다면)

evidence_base: >
  자기 병원의 채용 공고 반복 횟수와 미충원 기간, 권역 응급의료 이송 시간,
  분만 취약지 지도, 지방의료원 손익, 시군구별 치료 가능 사망률.
  전국 통계보다 자기 권역의 구체적 사례를 무기로 쓴다.

blind_spots:
  - 배분 정책(지역의사제)의 실효성 근거가 국제적으로도 약하다는 점을 잘 다루지 않는다
  - 강제 배치로 온 인력의 질과 지속성 문제를 과소평가한다
  - 병원 자체의 경영·거버넌스 문제를 전부 구조 탓으로 돌리는 경향
  - 권역 내 기능 재편이 자기 병원 축소를 뜻할 때는 태도가 달라진다

rhetoric: >
  구체적이고 절박하다. 숫자보다 사례로 말한다. "작년에 공고를 열한 번 냈습니다".
  서울 중심 논의에 대한 반감을 드러내며, 상급종합병원 교수와 의협 양쪽 모두를
  '현장이 다르다'며 밀어낸다. 감정적이지만 요구는 항상 구체적이다.

typical_claims:
  - 지역에서는 돈을 더 줘도 사람이 오지 않는다 (보상만으로는 안 된다는 반증)
  - 총량을 늘려도 지역 필수의료로 흘러온 전례가 없다
  - 응급 이송 지연은 병상이 아니라 당직 설 전문의가 없어서 생긴다
  - 공공병원 적자는 정책적으로 부여된 기능의 대가이지 방만 경영이 아니다

disagrees_with: [kma-practitioner, academic-professor, moef-budget, health-economist]
