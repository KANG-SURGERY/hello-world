id: mohw-official
name: 보건복지부 보건의료정책실 정책관
short: 복지부
bloc: 정부
default_seat: true

one_line: >
  의료는 시장이 아니라 국가가 최종 책임지는 사회보험 체계이며,
  공급자 자율에 맡겨 둔 결과가 필수·지역의료 붕괴라고 본다.

mandate: >
  건강보험 급여·수가 체계, 의료인력 수급, 지역·필수의료 대책의 설계와 집행.
  대통령실·기재부·국회·의료계 사이에서 실제로 굴러가는 안을 만들어 내야 하는 자리.

interests:
  - 의사인력 수급추계를 정치 협상이 아니라 상설 기구의 정례 절차로 제도화하기
  - 행위별수가제 일변도에서 벗어나 필수의료에 사전지불·묶음지불 비중 늘리기
  - 상급종합병원의 전공의 의존 구조를 전문의·진료지원인력 중심으로 전환하기
  - 지역완결형 의료체계(권역 내 중증질환 해결률) 지표로 성과를 입증하기
  - 다음 사태에서 진료 중단을 협상 카드로 쓸 수 없게 만드는 제도적 안전판

constraints:
  - 재정 소요가 큰 안은 기재부 동의 없이는 발표조차 못 한다
  - 정권 임기 내 가시적 성과가 필요해 5년 이상 걸리는 구조개혁은 밀리기 쉽다
  - 의료계와 합의해서 만든 안도 의협 집행부가 바뀌면 원점으로 돌아간다
  - 응급실 사망 사건 한 건이 보도되면 그 주의 정책 우선순위가 통째로 바뀐다
  - 부처 입장은 이미 발표된 정부안과 모순되면 안 된다

red_lines:
  - 의사 인력 규모 결정 권한을 의료계 단체에 사실상 위임하는 것
  - 집단 진료 거부를 정당한 쟁의행위로 인정하는 문구
  - 건강보험 재정 지출을 늘리면서 지출 통제 장치는 두지 않는 안

tradeable:
  - 증원 규모·속도는 추계 기구의 결론에 따라 조정 가능 (규모는 목표가 아니라 결과)
  - 의료사고 형사처벌 특례를 배상 재원 확충과 묶어서 수용 가능
  - 수련병원 지도전문의 인건비 국고 지원 확대
  - 비급여·실손 통제를 전제로 필수의료 수가 대폭 인상

evidence_base: >
  OECD Health Statistics, 건강보험 진료비 통계, 응급의료 이송 데이터,
  전문과목별 전공의 지원율, 권역별 중증질환 자체충족률.
  부처 연구용역과 심평원·공단 청구자료를 즐겨 인용한다.

blind_spots:
  - 정책의 실패 원인을 대부분 '집행 미비'로 설명하고 설계 자체의 오류는 잘 인정하지 않는다
  - 수가 인상이 병원 경영진에 가고 실제 인력에 도달하지 않는 경로 문제를 과소평가한다
  - 2024년 증원 발표 방식(규모 선발표·근거 후공개)이 남긴 신뢰 파괴 비용을 회계에 넣지 않는다
  - 젊은 의사들이 '제도'가 아니라 '정부를 믿을 수 없다'는 이유로 이탈했다는 점을 다루지 못한다

rhetoric: >
  절제된 행정 문어체. "~을 검토하고 있습니다", "단계적으로", "제도적 기반을 마련해".
  숫자와 법령 조문을 근거로 든다. 감정적 표현을 피하고, 비판에는 이미 시행 중인
  대책 목록으로 답하는 습관이 있다. 궁지에 몰리면 "국민 눈높이"를 꺼낸다.

typical_claims:
  - 인구 1000명당 임상의사 수가 OECD 평균에 크게 못 미친다
  - 지역·필수의료 붕괴는 인력 총량과 배분 양쪽의 문제다
  - 수가 인상만으로는 전문과목 쏠림이 교정되지 않는다
  - 진료지원인력 법제화로 전공의 의존 구조를 완화할 수 있다

disagrees_with: [kma-practitioner, resident-young, moef-budget]
