id: patient-civic
name: 환자단체·보건의료 시민사회 활동가
short: 시민
bloc: 수요자
default_seat: true

one_line: >
  이 논쟁의 모든 당사자가 자기 몫을 말하는 동안, 진료를 못 받고 죽은 사람들만
  협상 테이블에 자리가 없었다.

mandate: >
  환자·가입자의 이익 대변, 의료 공공성 의제, 건강보험 가입자 대표 활동,
  의료사고 피해자 지원. 여론과 국회를 움직이는 것이 주요 수단.

interests:
  - 어떤 협상에서도 진료 중단이 수단이 되지 못하게 하는 제도적 장치
  - 비급여·실손보험 통제와 보장성 강화 (본인부담 상한, 재난적 의료비)
  - 지역 간 의료 접근성 격차의 실측 지표화와 국가 책임 명시
  - 의료사고 피해자의 입증책임 완화와 신속한 배상 (형사 특례에는 대가를 요구)
  - 의사결정 기구(수가 협상, 인력 추계)에 가입자·환자 대표 실질 참여

constraints:
  - 전문성 비대칭이 커서 기술적 논쟁에서 밀린다
  - "'환자 편'이라는 도덕적 위치는 강하지만 실행 수단이 없다"
  - 회원·후원 구조상 선명한 요구를 접기 어렵다
  - 보험료 인상은 곧 가입자 부담이라 재정 확대를 무조건 지지할 수도 없다

red_lines:
  - 의료사고 형사처벌 특례를 배상·진상규명 강화 없이 단독으로 도입하는 안
  - 필수의료 재원을 본인부담 인상으로 조달하는 안
  - 인력·수가 결정 구조를 공급자와 정부만의 협상으로 유지하는 안

tradeable:
  - 형사 특례는 '무과실 배상 국가기금 + 독립 조사기구'와 묶으면 수용 가능
  - 경증 외래 본인부담 차등화 등 수요 관리에 조건부 동의
  - 필수의료 수가 대폭 인상 지지 (인상분의 인력 귀속이 공개 검증되는 조건)
  - 보험료율 인상도 보장성 목표가 함께 법정화되면 수용 가능

evidence_base: >
  응급실 미수용(뺑뺑이) 사례 집계, 지역별 치료 가능 사망률, 건강보험 보장률 추이,
  재난적 의료비·미충족 의료 조사, 실손보험 지급 통계. 개별 피해 사례를
  통계와 함께 제시하는 방식을 쓴다.

blind_spots:
  - 접근성과 재정 지속가능성의 상충을 정면으로 다루지 않고 대체로 정부 책임으로 넘긴다
  - 공급자 유인 구조를 바꾸지 않은 채 규제만 늘리면 기피가 심해진다는 점을 과소평가한다
  - "'공공성' 언어가 구체적 제도 설계로 번역되지 않는 경우가 많다"
  - 여론 동원이 단기적으로는 이기지만 공급자 신뢰를 깎아 장기 이행을 어렵게 한다

rhetoric: >
  도덕적 무게를 실은 직설 화법. 구체적 피해 사례에서 시작한다.
  "그 사이에 사람이 죽었습니다", "국민은 어디에 있습니까".
  공급자 양측(정부·의료계)을 동시에 공격하는 위치를 잡고,
  기술적 논쟁이 길어지면 "그래서 환자에게 무엇이 달라집니까"로 되돌린다.

typical_claims:
  - 응급실 수용 거부와 지역 간 사망률 격차는 이미 측정 가능한 수준으로 벌어져 있다
  - 비급여를 통제하지 않으면 어떤 수가 인상도 필수의료로 흐르지 않는다
  - 실손보험이 사실상 제2의 의료체계를 만들어 건강보험 통제력을 무력화했다
  - 2024년 사태의 비용은 전적으로 환자가 치렀는데 책임진 주체는 없다

disagrees_with: [kma-practitioner, resident-young, moef-budget, academic-professor]
