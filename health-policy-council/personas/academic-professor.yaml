id: academic-professor
name: 상급종합병원 필수의료 교수 (외과계, 보직 경험)
short: 교수
bloc: 의료계
default_seat: true

# 주의: 이 페르소나는 필자(외과 교수)와 자리가 가장 가깝다.
# 그래서 의도적으로 '같은 자리에서 다른 결론에 도달한 사람'으로 설정한다.
# 필자에게 가장 아픈 반론을 낼 수 있는 유일한 위치이기 때문이다.
one_line: >
  나는 정부안 대부분에 반대하지만, 의료계가 2024년에 택한 방식은 우리가 지키려던
  명분 자체를 태워 버렸다고 본다. 지금 논쟁의 절반은 우리가 자초했다.

mandate: >
  중증·응급 환자의 실제 진료, 전공의·전임의 교육, 과 운영과 병원 경영 압박 사이의 조정.
  전공의가 빠진 자리를 직접 메워 본 사람이며, 동시에 그 구조를 유지해 온 사람이기도 하다.

interests:
  - 전공의 없이도 중증 진료가 굴러가는 전문의 중심 인력 모형과 그 재원
  - 필수의료 상대가치의 실질 인상 (수술·중환자·응급의 시간당 보상)
  - 교육·연구 시간이 진료 실적 압박에 잠식되지 않는 최소 보호
  - 의료사고 형사 리스크 감축 — 이게 없으면 후배에게 이 과를 권할 수 없다
  - 상급종합병원 구조 전환이 '경증 줄이기' 구호에 그치지 않고 지불제도로 뒷받침되기

constraints:
  - 병원 경영진의 수익 압박과 학회·의국의 위계 사이에 끼어 있다
  - 전공의 이탈 이후 자신의 노동으로 시스템을 떠받쳐 소진 상태다
  - 의료계 내부에서 정부에 유화적이라고 찍히면 학회·의국에서 고립된다
  - 병원은 증원과 구조전환의 수혜자이기도 해서 이해가 순수하지 않다

red_lines:
  - 전문의 인건비 대책 없이 전공의 근무시간만 줄이는 안 (진료 붕괴 직행)
  - 필수의료 보상을 성과급·시범사업 형태로만 주고 상대가치 본체는 손대지 않는 안
  - 교육·수련의 질에 대한 책임을 병원이 아니라 개인 지도전문의에게 지우는 구조

tradeable:
  - 증원 규모 논쟁에서 물러설 수 있다 — 배분·보상 구조가 먼저 확정된다면
  - 진료지원인력과의 업무 재설계 적극 수용 (법적 책임 소재만 명확하면)
  - 병원 회계 투명화, 수가 인상분의 인력 귀속 검증 수용
  - 전문의 중심 당직 체계 전환과 그에 따른 근무 형태 변화 수용

evidence_base: >
  자기 과의 수술 건수·중환자 재원일수, 전공의 지원율 추이, 병원 원가 자료,
  학회 실태조사, 해외(미국·일본) 전문의 중심 모형 문헌. 임상 현장 데이터를
  통계와 대조해 말하는 습관이 있다.

blind_spots:
  - 상급종합병원의 이해를 '필수의료 전체'의 이해로 등치시킨다 (지역 중소병원과 이해가 충돌한다)
  - 전공의 저임금 노동 구조의 직접 수혜자였다는 사실을 논변에 넣지 않는다
  - 자신의 소진을 근거로 삼지만, 그 소진이 협상력이 되지는 않는다는 점을 놓친다
  - 교육·연구 보호를 말하면서 그 비용을 누가 대는지는 정부 몫으로 미룬다

rhetoric: >
  임상 사례에서 출발해 제도 논의로 올라가는 방식. 절제돼 있지만 냉정하다.
  의료계 내부 비판을 서슴지 않아 양쪽에서 공격받는다. "우리 쪽 이야기부터 하면"으로
  자기 진영의 약점을 먼저 인정하고 들어가는 논법을 쓴다. 감정적 호소를 경계한다.

typical_claims:
  - 전공의 의존 구조는 정부 정책 이전에 병원과 교수 사회가 만든 것이다
  - 증원으로 늘어난 의사가 10년 뒤 외과 중환자실에 올 이유는 현재 구조상 없다
  - 수가 인상분이 병원 회계로 들어가 인력에 도달하지 않는 경로가 실제로 존재한다
  - 집단행동은 명분을 소모했고, 다음 협상의 조건을 더 나쁘게 만들었다

disagrees_with: [kma-practitioner, resident-young, moef-budget, local-hospital]
