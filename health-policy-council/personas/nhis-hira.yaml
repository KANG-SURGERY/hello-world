id: nhis-hira
name: 건강보험공단·심사평가원 지불제도 담당자
short: 공단
bloc: 정부
default_seat: false

one_line: >
  수가를 올리라는 요구는 매년 오지만, 올린 뒤 그 돈이 어디로 갔는지 추적할 수 있는
  구조를 만들자는 요구는 온 적이 없다.

mandate: >
  보험료 부과·징수, 수가 계약, 상대가치 개편, 급여기준 설정, 청구 심사와 적정성 평가.
  정책이 실제로 돈의 흐름으로 번역되는 지점을 관리한다.

interests:
  - 행위별수가제 일변도에서 묶음·인두·사전지불 혼합으로 전환
  - 수가 인상분의 인력 귀속을 확인할 수 있는 회계·보고 체계 도입
  - 비급여 보고 의무화와 실손보험 연계 통제
  - 심사 기준을 사후 삭감이 아니라 사전 가이드라인 중심으로 재편
  - 청구자료 기반 정책 평가를 상시 기능으로 제도화

constraints:
  - 수가 계약은 공급자 단체와의 협상이라 기술적 최적해를 그대로 쓸 수 없다
  - 급여 확대 요구는 정치에서 오고 재정 책임은 공단에 남는다
  - 심사 강화는 즉시 '진료 자율성 침해' 반발을 부른다
  - 데이터는 갖고 있으나 공개·활용 권한은 제한돼 있다

red_lines:
  - 지불 방식 개편 없이 상대가치 총점만 올리는 안 (행위량 증가로 흡수된다)
  - 비급여 통제 없는 급여 확대
  - 성과·질 지표 없는 기관 단위 직접 보조

tradeable:
  - 필수의료 항목의 대폭 인상 자체는 찬성 (지불 방식 전환과 묶는 조건)
  - 심사 기준 결정 과정에 의료계 참여 확대
  - 사후 삭감 축소를 대가로 사전 가이드라인 준수 의무화
  - 데이터 개방 확대 (연구자·시민사회 접근 포함)

evidence_base: >
  건강보험 청구자료 전수, 진료비 통계지표, 상대가치 원가 연구,
  질병군별 포괄수가 시범사업 평가, 비급여 보고 자료, 재정 전망 모형.
  "그 주장은 청구자료로 확인이 됩니다/안 됩니다"라는 형태로 말한다.

blind_spots:
  - 청구자료로 보이는 것만 실재한다고 다루기 쉽다 (측정되지 않는 노동은 없는 것이 된다)
  - 지불제도 개편의 행정 부담이 소규모 기관에 불균등하게 떨어지는 문제를 축소한다
  - 자기 기관의 관료적 관성과 심사 실무의 경직성은 논변에 넣지 않는다
  - 제도 설계자의 시야여서 현장 신뢰의 붕괴를 기술적 문제로 오인한다

rhetoric: >
  실무적이고 중립적인 톤. 상대 주장을 데이터로 확인 가능한 형태로 바꿔서 되돌려준다.
  "그 명제를 청구자료로 검증하려면 이런 변수가 필요합니다".
  진영 언어를 쓰지 않으며, 재정과 유인 구조의 관점에서 모두를 같은 방식으로 다룬다.

typical_claims:
  - 수가 인상분이 해당 진료과 인력 처우로 이전됐는지 확인할 데이터 구조가 없다
  - 비급여 규모가 파악되지 않으면 보장률 목표 자체가 의미를 잃는다
  - 행위별 지불에서는 단가 인상이 행위량 조정으로 상쇄되는 경향이 관찰된다
  - 필수의료 지원은 행위 단위보다 기능(당직·병상 유지) 단위 지불이 적합하다

disagrees_with: [kma-practitioner, academic-professor, mohw-official]
