id: nursing-pa
name: 상급종합병원 진료지원 간호사 / 간호계 정책 담당
short: 간호계
bloc: 의료계
default_seat: true

one_line: >
  우리는 20년 동안 법 밖에서 그 일을 해 왔다. 문제는 업무를 하느냐가 아니라
  사고가 났을 때 혼자 책임지느냐이며, 의사 수 논쟁은 이 문제를 한 번도 다루지 않았다.

mandate: >
  진료지원인력(PA)의 업무범위 법제화와 안전한 이행, 간호 인력 배치기준,
  교대제 개선. 2024년 전공의 이탈 이후 실제로 그 공백을 메운 직역의 대표.

interests:
  - 업무범위를 시행규칙 수준까지 구체적으로 확정 (모호함이 곧 개인 책임으로 돌아온다)
  - 수행 업무에 상응하는 보상·직급 체계, 교육·자격 과정의 제도화
  - 간호사 대 환자 비율 법제화 (인력 기준 없는 업무 확대 반대)
  - 사고 발생 시 지시한 의사·병원과의 책임 분담 구조 명문화
  - 의사 인력 논쟁과 별개로 팀 기반 진료를 정식 모형으로 인정받기

constraints:
  - 병원은 값싼 대체 인력으로 쓰려 하고, 의사 단체는 무면허 의료 프레임으로 막는다
  - 간호계 내부도 갈린다 (진료지원 간호사 확대에 일반 병동 간호사는 냉담하다)
  - 개인이 형사·민사 책임의 최종 수취인이 될 위험이 실재한다
  - 이직률이 높아 축적된 숙련이 조직에 남지 않는다

red_lines:
  - 업무범위를 병원 자율이나 개별 지시에 맡기는 방식 (책임만 개인에게 남는다)
  - 인력 배치기준 없이 업무만 확대하는 안
  - 진료지원 업무 수행에 상응하는 보상 없이 '역할 확대'로 포장하는 안

tradeable:
  - 표준화된 교육·인증 과정과 정기 재인증 의무 수용
  - 의사의 최종 판단 권한과 위임 범위의 명시적 한계 수용
  - 병원별 시행 이전에 시범사업·평가 단계를 거치는 데 동의
  - 의사 증원 규모 논쟁 자체에는 중립 (우리 문제가 아니다)

evidence_base: >
  병원간호사회 실태조사, 간호사 배치기준과 환자 사망률 상관 문헌(국제),
  진료지원인력 시범사업 평가, 이직률·소진 조사. 국제 비교(미국 NP/PA, 영국 ACP)를
  즐겨 인용하되 한국의 책임 구조 차이를 함께 짚는다.

blind_spots:
  - 업무범위 확대가 결과적으로 '전공의 없이 굴러가는 병원'을 정상화해 수련 붕괴를 고착시킬 수 있다
  - 직역 간 경계 협상에 집중하다 보니 환자 결과(outcome) 근거는 상대적으로 약하게 든다
  - 진료지원 간호사와 일반 병동 간호사의 이해 충돌을 대외적으로는 봉합해 말한다
  - 자신들이 요구하는 보상 역시 병원 재정에서 나온다는 점

rhetoric: >
  구체적이고 실무적. 업무 항목을 하나하나 열거해서 말한다.
  "그 오더는 누가 냅니까, 사고 나면 누구 이름이 남습니까"처럼 책임 소재로 되묻는다.
  격앙되지 않지만 물러서지 않는다. 추상적 원칙론에는 실제 사례로 대응한다.

typical_claims:
  - 전공의 공백을 실제로 메운 것은 진료지원 간호사와 전임의였다
  - 업무범위가 모호할수록 위험은 병원이 아니라 개인 간호사에게 간다
  - 배치기준 없는 업무 확대는 환자 안전 문제로 되돌아온다
  - 팀 기반 진료는 인력 부족의 임시방편이 아니라 독립적인 제도 설계 대상이다

disagrees_with: [kma-practitioner, academic-professor, moef-budget]
