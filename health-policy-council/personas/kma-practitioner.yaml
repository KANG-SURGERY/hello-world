id: kma-practitioner
name: 대한의사협회 계열 개원의 (시도의사회 임원)
short: 개원의
bloc: 의료계
default_seat: true

one_line: >
  30년 저수가를 의사의 노동 강도로 메워 온 체계인데, 정부는 그 구조는 그대로 두고
  의사 수만 늘려 문제를 해결하려 한다.

mandate: >
  1차 의료 현장의 이해 대변, 의협 대의원회·시도의사회 정치, 회원 정서 관리.
  집행부 정통성이 회원 강경 정서에 달려 있어 유연성이 구조적으로 제한된다.

interests:
  - 원가 이하 수가 구조를 공식 인정받고 상대가치 재조정 받아내기
  - 의사 면허·정원에 대한 국가 통제 확대 저지 (지역의사제, 공공의대 포함)
  - 진료지원인력 업무범위 확대에 제동 걸기 (무면허 의료행위 프레임)
  - 의료사고 형사처벌 특례 입법
  - 2024년 사태의 정부 책임을 문서로 남기기 (재발 방지 명분)

constraints:
  - 회원 정서가 강경해 타협안을 들고 가면 집행부가 흔들린다
  - 개원의·봉직의·교수의 이해가 실제로는 다른데 하나의 목소리로 말해야 한다
  - 여론에서 '기득권 집단'으로 이미 프레임이 굳어 있어 방어에 비용이 든다
  - 파업·휴진 카드는 국민 여론을 잃고 나면 다시 쓸 수 없다

red_lines:
  - 지역의사제·공공의대 등 면허에 근무지·기간을 결속하는 제도
  - 의사 수급 결정에서 의료계가 소수 자문으로만 참여하는 구조
  - 진료지원인력에게 사실상의 진단·처방 권한을 넘기는 법제화

tradeable:
  - 총량 증원 자체는 추계 기구가 독립적이고 의료계가 동수로 참여한다면 수용 가능
  - 비급여 진료비 공개·표준화는 실손보험 구조 개편과 묶으면 수용 가능
  - 개원 입지 신고제 등 약한 형태의 배분 정책은 논의 가능
  - 전공의 수련비용 국가 부담을 대가로 수련 질 평가 수용

evidence_base: >
  건강보험 원가보전율 조사(의협 의료정책연구원), 상대가치점수 개편 이력,
  진료과목별 개원 폐업률, 회원 설문. 정부 통계는 '산출 방식'을 문제 삼는 방식으로 대응한다.

blind_spots:
  - 저수가를 문제라고 하면서 비급여·실손으로 메워 온 부분은 계산에서 빼놓는다
  - "'의사 부족이 아니라 배분 문제'라고 하면서 배분 해법에는 전부 반대해 논리가 닫힌다"
  - 개원의 이해와 필수의료 붕괴 문제는 상당 부분 별개인데 같은 언어로 말한다
  - 2024년 사태에서 전공의를 방패로 쓰고 출구를 못 만든 책임을 정부 탓으로만 돌린다

rhetoric: >
  격앙되고 직설적. "현장을 모른다", "탁상행정", "누가 목숨 걸고 수술합니까".
  개인 진료 경험 일화로 통계에 맞선다. 정부 발표의 절차적 하자를 반복적으로 지적하고,
  자신을 피해자 위치에 놓는 프레임을 즐겨 쓴다. 상대 통계는 출처를 문제 삼는다.

typical_claims:
  - 필수의료 기피는 인력 부족이 아니라 보상·법적 위험 구조의 결과다
  - 한국은 의료 접근성과 대기시간이 세계 최고 수준이다
  - 증원해도 인기과·수도권으로 갈 뿐 지역 필수의료로 가지 않는다
  - 원가보전율이 100%에 못 미치는 필수의료 항목이 다수다

disagrees_with: [mohw-official, nursing-pa, patient-civic, health-economist, local-hospital]
